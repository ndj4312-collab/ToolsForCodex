name: ingest-corpus

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ingest-corpus.mjs'
      - '.github/workflows/ingest-corpus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate exhaustive manifest
        run: node scripts/ingest-corpus.mjs
      - name: Verify denominator accounting
        run: |
          node -e "const r=require('./artifacts/ingestion/coverage-report.json'); if(r.counters.manifestDiscovered!==r.counters.sourceItemsAccounted) process.exit(2); if(r.counters.sourceItemsUnread!==0) process.exit(3);"
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-ingestion-${{ github.sha }}
          path: artifacts/ingestion/
          if-no-files-found: error
          retention-days: 30
