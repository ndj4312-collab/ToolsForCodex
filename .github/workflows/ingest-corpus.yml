name: ingest-corpus

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ingest-corpus.mjs'
      - 'scripts/compile-ingestion-routes.mjs'
      - 'scripts/promote-approved-proposals.mjs'
      - 'scripts/validate-endurance-effects.mjs'
      - 'pointer-catalog/ingestion/ENDURANCE_VALIDATION_RESULTS.json'
      - '.github/workflows/ingest-corpus.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate exhaustive manifest
        run: node scripts/ingest-corpus.mjs
      - name: Verify denominator accounting
        run: |
          node -e "const r=require('./artifacts/ingestion/coverage-report.json'); if(r.counters.manifestDiscovered!==r.counters.sourceItemsAccounted) process.exit(2); if(r.counters.sourceItemsUnread!==0) process.exit(3);"
      - name: Compile routes and terminal dispositions
        run: node scripts/compile-ingestion-routes.mjs
      - name: Prepare approved proposal lifecycle candidates
        run: node scripts/promote-approved-proposals.mjs
      - name: Assert all 456 proposals are prepared but not falsely endured
        run: |
          node - <<'NODE'
          const r=require('./pointer-catalog/ingestion/APPROVED_PROPOSAL_LIFECYCLE_REGISTRY.json');
          const c=r.coverage;
          const fields=['discovered','specified','ticketed','implemented','accepted','pendingValidation'];
          for(const f of fields){if(c[f]!==456){console.error(`${f}=${c[f]} expected 456`);process.exit(5)}}
          if(c.endured!==0||c.wikiActivated!==0||!c.preparationComplete||c.complete) process.exit(6);
          for(const x of r.items){
            if(x.spec.status!=='PASS'||x.ticket.status!=='PASS'||x.implementation.status!=='PASS'||x.acceptance.status!=='PASS'||x.endure.status!=='PENDING_VALIDATION'||x.wiki.status!=='REFERENCE_READY'){
              console.error('Preparation/endurance state gap',x.lifecycleId); process.exit(7);
            }
          }
          NODE
      - name: Validate endurance effects fail-closed
        run: node scripts/validate-endurance-effects.mjs
      - name: Persist canonical pointer and lifecycle registries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pointer-catalog/ingestion/CAPABILITY_ROUTE_REGISTRY.json \
            pointer-catalog/ingestion/INGESTION_RECEIPT.md \
            pointer-catalog/ingestion/APPROVED_PROPOSAL_LIFECYCLE_REGISTRY.json \
            pointer-catalog/ingestion/APPROVED_PROPOSAL_ACTIVE_ROUTES.json \
            pointer-catalog/ingestion/APPROVED_PROPOSAL_ENDURANCE_INDEX.md \
            pointer-catalog/ingestion/ENDURANCE_VALIDATION_COVERAGE.json
          if git diff --cached --quiet; then
            echo "Registries already current"
          else
            git commit -m "Persist approved proposal lifecycle and endurance registry"
            git push
          fi
      - name: Assert no useful proposal skill is blocked
        run: |
          node -e "const r=require('./pointer-catalog/ingestion/CAPABILITY_ROUTE_REGISTRY.json'); const bad=r.items.filter(x=>x.path.endsWith('/SKILL.md')&&x.route.status!=='ROUTED'); if(bad.length){console.error(bad); process.exit(4)}"
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-ingestion-${{ github.sha }}
          path: |
            artifacts/ingestion/
            pointer-catalog/ingestion/
          if-no-files-found: error
          retention-days: 30
