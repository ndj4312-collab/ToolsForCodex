name: probe-starred-inventory

on:
  push:
    branches:
      - probe/starred-inventory-2026-09-04

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current starred repositories
        shell: bash
        run: |
          curl -fsSL \
            -H 'Accept: application/vnd.github.star+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/users/ndj4312-collab/starred?per_page=100' > stars.json
          python - <<'PY'
          import json
          data=json.load(open('stars.json', encoding='utf-8'))
          print('STAR_COUNT', len(data))
          for item in data:
              repo=item.get('repo', item)
              print(f"STAR\t{item.get('starred_at','UNKNOWN')}\t{repo.get('full_name')}\t{repo.get('html_url')}\t{repo.get('default_branch')}\t{repo.get('archived')}\t{repo.get('license',{}).get('spdx_id') if repo.get('license') else 'NOASSERTION'}")
          PY
