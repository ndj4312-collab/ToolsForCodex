name: probe-fast-uri-fix

on:
  push:
    branches:
      - probe/fast-uri-audit-fix-2026-09-04

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact lockfile-only security patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('package-lock.json')
          s = p.read_text()
          old = '''    "node_modules/fast-uri": {\n      "version": "3.1.5",\n      "resolved": "https://registry.npmjs.org/fast-uri/-/fast-uri-3.1.5.tgz",\n      "integrity": "sha512-gHwA1O9LDIcKunMKhObS/HimwtehO1nPUECKAu5TpKgaO19fcWEl4bliWe1jWxVFvIXztJjjQ4L8XQ1EU9f7Jw==",'''
          new = '''    "node_modules/fast-uri": {\n      "version": "3.1.7",\n      "resolved": "https://registry.npmjs.org/fast-uri/-/fast-uri-3.1.7.tgz",\n      "integrity": "sha512-dOvZVzjdZdz7phd9v6jCbwxrBW3fK6n8Rc0CtdmM4bumzMnxywBYhuph6J819RRw/ku+rLbelwfMunktuzVVHg==",'''
          if s.count(old) != 1:
              raise SystemExit(f'expected exact vulnerable block once, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          test "$(git diff --name-only)" = 'package-lock.json'
          grep -A3 '"node_modules/fast-uri"' package-lock.json
          npm audit --package-lock-only --audit-level=high
      - name: Create clean security branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b security/fast-uri-3.1.7
          git add package-lock.json
          git commit -m 'Fix fast-uri security advisories'
          git push --force-with-lease origin HEAD:security/fast-uri-3.1.7
