name: probe-fast-uri-fix

on:
  push:
    branches:
      - probe/fast-uri-audit-fix-2026-09-04

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate package-lock-only audit fix
        shell: bash
        run: |
          cp package.json /tmp/package.before.json
          npm audit fix --package-lock-only
          cmp -s package.json /tmp/package.before.json || { echo 'package.json changed unexpectedly'; exit 1; }
          node -e "const l=require('./package-lock.json'); const p=l.packages['node_modules/fast-uri']; console.log('FAST_URI',p.version,p.resolved); if(p.version!=='3.1.7') process.exit(1)"
          npm audit --audit-level=high
          test "$(git diff --name-only)" = 'package-lock.json'
      - name: Create clean security branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b security/fast-uri-3.1.7
          git add package-lock.json
          git commit -m 'Fix fast-uri security advisories'
          git push --force-with-lease origin HEAD:security/fast-uri-3.1.7
