name: probe-fast-uri-lockgen

on:
  push:
    branches:
      - probe/fast-uri-lockgen-2026-09-04

permissions:
  contents: write

jobs:
  lockgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate lockfile-only transitive update
        shell: bash
        run: |
          cp package.json /tmp/package.before.json
          npm install fast-uri@3.1.7 --package-lock-only --save=false
          cmp -s package.json /tmp/package.before.json || { echo 'package.json changed unexpectedly'; exit 1; }
          node -e "const l=require('./package-lock.json'); const p=l.packages['node_modules/fast-uri']; console.log('FAST_URI',p.version,p.resolved); if(p.version!=='3.1.7') process.exit(1)"
          npm audit --audit-level=high
          git diff --exit-code -- package.json
      - name: Commit generated lockfile only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet && { echo 'No lockfile change generated'; exit 1; }
          test "$(git diff --cached --name-only)" = 'package-lock.json'
          git commit -m 'Probe safe fast-uri lockfile update'
          git push origin HEAD:probe/fast-uri-lockgen-2026-09-04
